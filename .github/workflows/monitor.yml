name: Monitor Baozinho

on:
  schedule:
    # Roda a cada 20 minutos
    - cron: '*/20 * * * *'
  # Permite que você clique num botão no site do GitHub para rodar o bot manualmente quando quiser testar
  workflow_dispatch: 

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Copiar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar o bot de monitoramento
        run: python bot_monitor.py
